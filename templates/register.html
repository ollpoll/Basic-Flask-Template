{% extends "layout.html" %}
{% block content %}

    <h2>Register</h2>

    {{message}}

    <form action="/register" enctype="multipart/form-data" method="POST">

        <label for="fname">First name:</label><br>
            <input type="text" id="fname" name="fname" value="" required><br>
            
        <label for="lname">Last name:</label><br>
            <input type="text" id="lname" name="lname" value="" required><br>

        <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" value="" required><br>

        <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" value="" required><br>

        <label for="email">Password Confirm:</label><br>
            <input type="password" id="passwordconfirm" name="passwordconfirm" value="" required><br>
        <br>

        <label for="permission">Register as:</label><br>
            <select id="permission" name="permission" required>
                <option value="client">Client</option>
                <option value="valuator">Valuator</option>
            </select><br>
        <br>

        <div id="valuator-details" hidden>
            <label for="hireprice">Hire price:</label><br>
                <input type="number" id="hireprice" name="hireprice" min="0" step="0.01"><br>

            <label for="specialty">Specialty:</label><br>
                <input type="text" id="specialty" name="specialty"><br>

            <label for="location">Location:</label><br>
                <input type="text" id="location" name="location"><br>
            <br>
        </div>

        <label for="profilephoto">Profile Photo:</label><br>
            <input type="file" name="file">
        <br>

        <input type="submit" value="Submit">
    </form> 

{% endblock %}

{% block scripts %}
<script>
    const permissionSelect = document.getElementById("permission");
    const valuatorDetails = document.getElementById("valuator-details");
    const valuatorFields = valuatorDetails.querySelectorAll("input");

    function updateValuatorFields() {
        const isValuator = permissionSelect.value === "valuator";
        valuatorDetails.hidden = !isValuator;
        valuatorFields.forEach((field) => field.required = isValuator);
    }

    permissionSelect.addEventListener("change", updateValuatorFields);
    updateValuatorFields();
</script>
{% endblock %}
